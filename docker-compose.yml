services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 external_auth_project.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8010:8000"
    env_file:
      - ./.env.prod
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=survey_prod_db
      - POSTGRES_USER=survey_user
      # Parol faqat birinchi initda ishlatiladi; runtime .env DB_PASSWORD bilan mos bo'lsin
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme_set_in_env}
    # Tashqi tarmoqqa ochilmasin — faqat localhost (FIND-005)
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey_user -d survey_prod_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Parol majburiy (FIND-002)
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # Faqat localhost (FIND-002)
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    build: .
    command: celery -A external_auth_project worker -l info
    volumes:
      - .:/app
    env_file:
      - ./.env.prod
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
